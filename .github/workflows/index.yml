name: Index

# Weekly: rebuild data/index.json and data/graph.json from the RFC Editor's index and commit them if they changed.
# The commit triggers a deploy.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/build-index.mjs
      - run: node tools/build-topics.mjs
      - run: node tools/build-people.mjs
      - run: node --test tests/*.test.js
      - name: Commit if changed
        run: |
          git config user.name "readrfc index"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update the RFC index" && git push)
